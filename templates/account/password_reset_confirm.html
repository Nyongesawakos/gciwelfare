<!DOCTYPE html>
<html>
<head>
<title>Set New Password</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* Card container */
.container{
    background:white;
    padding:35px;
    width:100%;
    max-width:400px;
    border-radius:10px;
    box-shadow:0 6px 25px rgba(0,0,0,0.08);
}

/* Heading */
h2{
    text-align:center;
    margin-bottom:25px;
}

/* Inputs */
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:6px;
    font-size:16px;
}

/* Button */
button{
    width:100%;
    padding:12px;
    background:#2463eb;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

    .form__error {
  color: #ff4d4f;
  font-size: 1.3rem;
  margin-top: 0.5rem;
}
button:hover{
    background:#1d4fd7;
}

/* Mobile adjustments */
@media (max-width:480px){

    .container{
        padding:25px;
    }

    h2{
        font-size:20px;
    }

}

</style>

</head>

<body>



<form method="post">
{% csrf_token %}

<label>Password</label>
{{ form.new_password1 }}

{% if form.new_password1.errors %}
<div class="form__error">
    {{ form.new_password1.errors }}
</div>
{% endif %}


<label>Confirm Password</label>
{{ form.new_password2 }}

{% if form.new_password2.errors %}
<div class="form__error">
    {{ form.new_password2.errors }}
</div>
{% endif %}

<button type="submit">Reset Password</button>

</form>

</body>
</html>
