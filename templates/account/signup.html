{% load socialaccount %}

<!DOCTYPE html>
<html>
<head>
<title>Sign Up</title>

<style>
body{
    font-family: Arial;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:40px;
    width:350px;
    border-radius:8px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#2463eb;
    color:white;
    border:none;
    border-radius:5px;
}

.link{
    text-align:center;
    margin-top:10px;
}
</style>

</head>

<body>

<div class="box">

<h2>Create Account</h2>

<form method="POST">
{% csrf_token %}
{{ form.as_p }}

<button type="submit">Sign Up</button>

</form>

<div class="link">
Already have an account?
<a href="{% url 'account_login' %}">Login</a>
</div>

</div>

</body>
</html>
