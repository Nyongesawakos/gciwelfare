<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* container */
.box{
    background:white;
    padding:35px;
    width:100%;
    max-width:380px;
    border-radius:10px;
    box-shadow:0 6px 25px rgba(0,0,0,0.08);
}

/* heading */
h2{
    text-align:center;
    margin-bottom:20px;
}

/* inputs */
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:6px;
    font-size:16px;
}

/* button */
button{
    width:100%;
    padding:12px;
    background:#2463eb;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4fd7;
}

/* MOBILE ADJUSTMENTS */
@media (max-width:480px){

    .box{
        padding:25px;
        border-radius:8px;
    }

    h2{
        font-size:20px;
    }

    input{
        padding:10px;
    }

    button{
        padding:11px;
    }

}

</style>

</head>

<body>

<div class="box">

<h2>Forgot Password</h2>

<form method="POST">
{% csrf_token %}
{{ form.as_p }}

<button type="submit">Reset Password</button>

</form>

</div>

</body>
</html>
