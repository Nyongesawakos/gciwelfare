<!DOCTYPE html>
<html>
<head>
<title>Email Sent</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Card */
.box{
    background:white;
    padding:40px;
    width:100%;
    max-width:400px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 6px 25px rgba(0,0,0,0.08);
}

h3{
    margin-bottom:15px;
    color:#333;
}

p{
    color:#666;
    margin-bottom:25px;
}

/* Optional button */
a{
    display:inline-block;
    padding:10px 20px;
    background:#2463eb;
    color:white;
    text-decoration:none;
    border-radius:6px;
}

a:hover{
    background:#1d4fd7;
}

/* Mobile */
@media (max-width:480px){
    .box{
        padding:30px;
    }

    h3{
        font-size:18px;
    }
}
.box{
    animation:fadeIn 0.4s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}
</style>

</head>

<body>

<div class="box">

<h3>📩 Password reset link sent</h3>
<p>Please check your email to continue.</p>

<a href="/login/">Back to Login</a>

</div>

</body>
</html>
