{% load socialaccount %}
<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>

body{
    font-family: Arial;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:white;
    padding:40px;
    width:350px;
    border-radius:8px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#2463eb;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.google-btn{
    margin-top:15px;
    display:block;
    text-align:center;
    background:#4285F4;
    color:white;
    padding:12px;
    border-radius:5px;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Login</h2>

<form method="POST">
{% csrf_token %}
{{ form.as_p }}

<button type="submit">Login</button>
</form>

<a href="{% provider_login_url 'google' %}" class="google-btn">
Login with Google
</a>

</div>

</body>
</html>
