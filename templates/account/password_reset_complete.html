<!DOCTYPE html>
<html>
<head>
<title>Password Reset Successful</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Card */
.box{
    background:white;
    padding:40px;
    width:100%;
    max-width:380px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 6px 25px rgba(0,0,0,0.08);
}

h3{
    margin-bottom:25px;
    color:#333;
}

/* Login button */
a{
    display:inline-block;
    padding:12px 25px;
    background:#2463eb;
    color:white;
    text-decoration:none;
    border-radius:6px;
    font-size:16px;
}

a:hover{
    background:#1d4fd7;
}

/* Mobile */
@media (max-width:480px){

    .box{
        padding:30px;
    }

    h3{
        font-size:18px;
    }

}

</style>

</head>

<body>

<div class="box">

<h3>Password successfully reset</h3>

<a href="/login/">Login</a>

</div>

</body>

</html>
