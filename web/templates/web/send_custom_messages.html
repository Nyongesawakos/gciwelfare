<!DOCTYPE html>
<html>
<head>
    <title>Send WhatsApp Messages</title>
</head>
<body>
    <h2>Send Customized WhatsApp Messages</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send Messages</button>
    </form>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
</body>
</html>
