{% include 'main.html' %}
{%load static%}


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .sub-header {
      background-color: #BA8E23;
      color: white;
      padding: 10px 20px;
    }

    .menu-toggle {
      display: none;
      font-size: 24px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    .sub-nav {
      display: flex;
      gap: 20px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sub-nav li a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      display: block;
    }

    .sub-nav li a:hover {
      background-color: #575757;
      border-radius: 4px;
    }

    /* Mobile view */
    @media (max-width: 768px) {
      .sub-nav {
        display: none;
        flex-direction: column;
        margin-top: 10px;
      }

      .sub-nav.show {
        display: flex;
      }

      .menu-toggle {
        display: block;
      }
    }
  </style>
</head>
<body>

  <div class="sub-header">
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <ul class="sub-nav" id="subNav">
      <li><a href="{% url 'root' %}">Home</a></li>
      <li><a href="{% url 'home' %}">Go to welfare</a></li>
      <li><a href="{% url 'about' %}">About Us</a></li>
      <li><a href="{% url 'activities' %}">Activities</a></li>
      
    </ul>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById('subNav').classList.toggle('show');
    }
  </script>

</body>
</html>

<body>
    
  <div class="hero-section">
    <div class="background-overlay"></div>
    
    <div class="carousel">
      <div class="slide active">Welcome to <b style="color: #BA8E23;">GCIWELFARE</b><br>We are happy to have you on board</div>
      <div class="slide">You can Contact us Through<br>Our social media platforms</div>
      <div class="slide">This is our Welfare Contact <br>0789592245</div>
      
      <button class="prev">&#10094;</button>
      <button class="next">&#10095;</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<style>

/* ================= ROOT ================= */
:root{
    --primary-gold:#BA8E23;
    --primary-dark:#051634;
    --white:#ffffff;
    --overlay:rgba(0,0,0,0.55);
}

/* ================= RESET ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%; /* 🔥 removes scroll bar issue */
    font-family:Arial,sans-serif;
    background:#f4f6f8;
}

/* ================= SUB HEADER ================= */
.sub-header{
    width:100%;
    background:#051634;
    backdrop-filter:blur(10px);
    padding:14px 25px;
    position:relative;
    top: 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    z-index:1000;
}

.menu-toggle{
    display:none;
    font-size:30px;
    background:none;
    border:none;
    color:white;
    cursor:pointer;
}

.sub-nav{
    display:flex;
    gap:12px;
    list-style:none;
    flex-wrap:wrap;
}

.sub-nav li a{
    color:white;
    text-decoration:none;
    padding:10px 14px;
    border-radius:8px;
    font-weight:600;
    transition:0.3s ease;
}

.sub-nav li a:hover{
    background:var(--primary-gold);
}

/* ================= HERO ================= */
.hero-section{
    position:relative;
    width:100%;
    min-height:100vh;
    background:url("{% static '/images/welfare.jpg' %}") center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* OVERLAY */
.background-overlay{
    position:absolute;
    inset:0;
    background:var(--overlay);
}

/* ================= CAROUSEL ================= */
.carousel{
    position:relative;
    z-index:2;
    width:90%;
    max-width:1100px;
    text-align:center;
    color:white;
    padding:20px;
}

/* SLIDES */
.slide{
    display:none;
    font-size:clamp(1.5rem, 4vw, 4rem);
    font-weight:700;
    line-height:1.4;
    padding:10px;
}

.slide.active{
    display:block;
}

/* ================= BUTTONS ================= */
button.prev,
button.next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:1.5rem;
    cursor:pointer;
}

button.prev{ left:10px; }
button.next{ right:10px; }

/* ================= MOBILE ================= */
@media (max-width:768px){

    .menu-toggle{
        display:block;
    }

    .sub-nav{
        display:none;
        flex-direction:column;
        width:100%;
        margin-top:10px;
    }

    .sub-nav.show{
        display:flex;
    }

    .sub-nav li a{
        width:100%;
        display:block;
        background:rgba(255,255,255,0.06);
    }

    .carousel{
        width:95%;
    }

    button.prev,
    button.next{
        width:40px;
        height:40px;
        font-size:1.2rem;
    }
}

/* ================= SMALL PHONES ================= */
@media (max-width:480px){

    .slide{
        font-size:1.3rem;
    }

    .sub-header{
        padding:10px;
    }
}
</style>
<script>
const slides = document.querySelectorAll('.slide');
let current = 0;

function showSlide(index) {
  slides.forEach((slide, i) => {
    slide.classList.remove('active');
    if (i === index) slide.classList.add('active');
  });
}

document.querySelector('.prev').addEventListener('click', () => {
  current = (current - 1 + slides.length) % slides.length;
  showSlide(current);
});

document.querySelector('.next').addEventListener('click', () => {
  current = (current + 1) % slides.length;
  showSlide(current);
});

// Auto-rotate every 5 seconds
setInterval(() => {
  current = (current + 1) % slides.length;
  showSlide(current);
}, 5000);

</script>
