{%include 'web/main1.html'%}
{%load static%}
{% block content %}


<div class="content">
    <form class="search-bar">

        <form method="get" action="{% url 'members' %}" class="search-bar">
    <input
        type="text"
        name="q"
        placeholder="Search by name, reg no, email..."
        value="{{ query|default:'' }}"
    >
    <button type="submit">Search</button>
</form>

    </form>

    <div class="table-container">

<div class="table-wrapper">
        <table class="students-table">
            <thead>
    <tr>
        <th>Expense</th>
        <th>Date</th>
        <th>Amount</th>
        <th>Edit</th>
        <th>Delete</th>
       
        
        
    </tr>
    </thead>
 <tbody>
     {% for cash_expenditure in s %} 
    <tr>
         <td>{{cash_expenditure.Expense}}</td>
        <td>{{cash_expenditure.Date}}</td>
        <td>{{cash_expenditure.Amount}}</td>
         <td><a style="color: #10b981;;" class="btn btn--main"  href="">Edit Info</a></td>
         <td><a style="color: red;" class="btn btn--main" href="">Delete record</a></td>
      
        
        
      <style>
        a {
    text-decoration: none;
}

      </style>
    </tr>
    {% empty %}
    <tr>
        <td colspan="4">No results found</td>
    </tr>
    {% endfor %}
    </tbody>
    
</table>
</div>
</div>
    
</div>




<style>
    


/* Main container */
.table-container {
    width: 100%;
    min-height: calc(100vh - 80px); /* fills screen below topbar */
    margin: 0;
    background: #ffffff;
    padding: 25px 30px;
    border-radius: 0;
    box-shadow: none;
}

/* Header */
.table-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.table-header h2 {
    margin: 0;
    color: #333;
}








/* Table wrapper (for horizontal scroll on mobile) */
.table-wrapper {
    overflow-x: auto;
}

/* Table */
.students-table {
    width: 100%;
    border-collapse: collapse;
}

.students-table th {
    background: #f0f3ff;
    padding: 14px;
    text-align: left;
    font-size: 14px;
}

.students-table td {
    padding: 14px;
    border-top: 1px solid #eee;
    font-size: 14px;
}

.students-table tr:hover {
    background: #f9faff;
}

/* Empty state */
.no-results {
    text-align: center;
    padding: 20px;
    color: #777;
}


</style>
{%endblock%}
