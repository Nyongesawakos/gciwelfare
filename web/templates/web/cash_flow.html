   {%include 'web/main1.html'%}
{%load static%}
{% block content %}

        

    <!-- Content -->
  <div class="content">
    <div class="card">
        <h1>Update Outflows</h1>

        <form method="post" class="form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn primary">Update Record</button>
        </form>

      

       
    </div>
</div>


<style>

/* ================= ROOT COLORS ================= */
:root{
    --primary-blue:#1390cd;
    --primary-blue-dark:#0f7bb3;
    --primary-yellow:#f5d021;
    --primary-green:#10b981;
    --background:#f4f6f8;
    --white:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --border:#d1d5db;
}

/* ================= RESET ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    overflow-x:hidden;
    background:var(--background);
    font-family:Arial,sans-serif;
}

/* ================= PAGE WRAPPER ================= */
.content{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

/* ================= CARD ================= */
.card{
    width:100%;
    max-width:700px;
    background:var(--white);
    border-radius:20px;
    padding:40px;
    border-top:6px solid var(--primary-yellow);
    box-shadow:0 12px 30px rgba(0,0,0,0.07);
    animation:fadeIn 0.4s ease-in-out;
}

/* ================= HEADINGS ================= */
.card h1{
    font-size:34px;
    margin-bottom:30px;
    text-align:center;
    color:var(--primary-blue);
    font-weight:700;
}

.card h3{
    margin:25px 0 12px;
    font-size:18px;
    text-align:center;
    color:#374151;
}

/* ================= FORM ================= */
.form{
    width:100%;
}

.form p{
    margin-bottom:20px;
}

/* LABELS */
.form label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:8px;
    color:#374151;
}

/* INPUTS */
.form input,
.form select,
.form textarea,
.upload-form input[type="file"]{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid var(--border);
    font-size:15px;
    transition:0.3s ease;
    background:white;
}

/* TEXTAREA */
.form textarea{
    min-height:140px;
    resize:vertical;
}

/* INPUT FOCUS */
.form input:focus,
.form select:focus,
.form textarea:focus{
    border-color:var(--primary-blue);
    box-shadow:0 0 0 4px rgba(19,144,205,0.12);
    outline:none;
}

/* ================= BUTTONS ================= */
.btn{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:none;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s ease;
}

/* PRIMARY BUTTON */
.btn.primary{
    background:linear-gradient(
        135deg,
        var(--primary-blue),
        var(--primary-blue-dark)
    );
    color:white;
    margin-top:10px;
}

/* SECONDARY BUTTON */
.btn.secondary{
    background:var(--primary-green);
    color:white;
    margin-top:10px;
}

/* HOVER */
.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(0,0,0,0.12);
}

/* ================= DIVIDER ================= */
.divider{
    display:flex;
    align-items:center;
    text-align:center;
    margin:30px 0;
    font-size:13px;
    color:var(--muted);
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#e5e7eb;
}

.divider::before{
    margin-right:12px;
}

.divider::after{
    margin-left:12px;
}

/* ================= UPLOAD FORM ================= */
.upload-form{
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* ================= ANIMATION ================= */
@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* ================= LARGE DESKTOP ================= */
@media (min-width:1600px){

    .card{
        max-width:850px;
        padding:50px;
    }

    .card h1{
        font-size:40px;
    }

    .form input,
    .form select,
    .form textarea{
        font-size:16px;
        padding:16px 18px;
    }

}

/* ================= TABLET ================= */
@media (max-width:1024px){

    .content{
        padding:20px;
    }

    .card{
        padding:32px;
    }

}

/* ================= MOBILE ================= */
@media (max-width:768px){

    .content{
        padding:12px;
        align-items:flex-start;
    }

    .card{
        padding:22px;
        border-radius:16px;
    }

    .card h1{
        font-size:26px;
        margin-bottom:22px;
    }

    .form input,
    .form select,
    .form textarea{
        padding:13px;
        font-size:14px;
    }

    .btn{
        padding:14px;
        font-size:14px;
    }

}

/* ================= EXTRA SMALL DEVICES ================= */
@media (max-width:480px){

    .card{
        padding:18px;
    }

    .card h1{
        font-size:22px;
    }

    .form input,
    .form select,
    .form textarea{
        font-size:13px;
    }

}

</style>
{%endblock%}
