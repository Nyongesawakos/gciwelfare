{% include 'web/main1.html' %}
{% load static %}

{% block content %}

<style>

/* =========================
   ROOT COLORS
========================= */

:root {
    --primary-blue: #1390cd;
    --primary-blue-dark: #0d78ad;
    --primary-yellow: #f5d021;
    --primary-red: #e72326;
    --dark: #111827;
    --text: #374151;
    --muted: #6b7280;
    --border: #d1d5db;
    --light: #f5f7fa;
    --white: #ffffff;
}


/* =========================
   PAGE
========================= */

.manual-entry-page {
    width: 100%;
    min-height: calc(100vh - 80px);

    padding: 30px;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    background: var(--light);
}


/* =========================
   FORM CARD
========================= */

.form-card {

    width: 100%;
    max-width: 700px;

    background: var(--white);

    border-radius: 18px;

    padding: 32px;

    border-top: 6px solid var(--primary-yellow);

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.07);

    animation: fadeIn .35s ease;
}


/* =========================
   HEADER
========================= */

.form-header {
    margin-bottom: 28px;

    padding-bottom: 18px;

    border-bottom: 1px solid #e5e7eb;
}

.form-header h2 {

    margin: 0;

    color: var(--primary-blue);

    font-size: 28px;

    font-weight: 700;
}

.form-header p {

    margin-top: 7px;

    color: var(--muted);

    font-size: 14px;
}


/* =========================
   DJANGO FORM
========================= */

.transaction-form p {

    margin: 0 0 20px 0;
}


/* LABEL */

.transaction-form label {

    display: block;

    margin-bottom: 7px;

    color: var(--text);

    font-size: 14px;

    font-weight: 600;
}


/* INPUTS */

.transaction-form input,
.transaction-form select,
.transaction-form textarea {

    width: 100%;

    padding: 13px 15px;

    border: 1px solid var(--border);

    border-radius: 10px;

    background: #ffffff;

    color: var(--dark);

    font-size: 15px;

    outline: none;

    transition: all .2s ease;
}


/* FOCUS */

.transaction-form input:focus,
.transaction-form select:focus,
.transaction-form textarea:focus {

    border-color: var(--primary-blue);

    box-shadow:
        0 0 0 3px rgba(19, 144, 205, 0.12);
}


/* TEXTAREA */

.transaction-form textarea {

    min-height: 110px;

    resize: vertical;
}


/* SELECT */

.transaction-form select {

    cursor: pointer;

    appearance: auto;
}


/* =========================
   HELP TEXT
========================= */

.transaction-form .helptext {

    display: block;

    margin-top: 6px;

    color: var(--muted);

    font-size: 12px;
}


/* =========================
   ERRORS
========================= */

.transaction-form .errorlist {

    list-style: none;

    padding: 0;

    margin: 6px 0 0;

    color: var(--primary-red);

    font-size: 13px;

    font-weight: 500;
}


/* =========================
   BUTTON AREA
========================= */

.form-actions {

    display: flex;

    justify-content: flex-end;

    gap: 12px;

    margin-top: 28px;

    padding-top: 20px;

    border-top: 1px solid #e5e7eb;
}


/* =========================
   SAVE BUTTON
========================= */

.save-btn {

    border: none;

    background: var(--primary-blue);

    color: white;

    padding: 13px 28px;

    border-radius: 10px;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition: all .25s ease;
}


.save-btn:hover {

    background: var(--primary-blue-dark);

    transform: translateY(-1px);

    box-shadow:
        0 6px 15px rgba(19, 144, 205, 0.25);
}


.save-btn:active {

    transform: translateY(0);
}


/* =========================
   OPTIONAL CANCEL
========================= */

.cancel-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding: 13px 22px;

    border-radius: 10px;

    border: 1px solid #d1d5db;

    background: #ffffff;

    color: #374151;

    text-decoration: none;

    font-size: 15px;

    font-weight: 600;

    transition: .2s ease;
}


.cancel-btn:hover {

    background: #f3f4f6;
}


/* =========================
   REQUIRED FIELD
========================= */

.transaction-form input:required,
.transaction-form select:required,
.transaction-form textarea:required {

    background-color: #fff;
}


/* =========================
   ANIMATION
========================= */

@keyframes fadeIn {

    from {

        opacity: 0;

        transform: translateY(10px);
    }

    to {

        opacity: 1;

        transform: translateY(0);
    }
}


/* =========================
   TABLET
========================= */

@media (max-width: 768px) {

    .manual-entry-page {

        padding: 18px;
    }

    .form-card {

        padding: 25px;

        border-radius: 15px;
    }

    .form-header h2 {

        font-size: 24px;
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    .manual-entry-page {

        padding: 10px;
    }

    .form-card {

        padding: 20px;

        border-radius: 12px;

        border-top-width: 5px;
    }

    .form-header {

        margin-bottom: 22px;
    }

    .form-header h2 {

        font-size: 21px;
    }

    .form-header p {

        font-size: 13px;
    }

    .transaction-form label {

        font-size: 13px;
    }

    .transaction-form input,
    .transaction-form select,
    .transaction-form textarea {

        padding: 12px;

        font-size: 14px;
    }

    .form-actions {

        flex-direction: column;

        gap: 10px;
    }

    .save-btn,
    .cancel-btn {

        width: 100%;

        text-align: center;
    }

}


/* =========================
   PRINT
========================= */

@media print {

    .manual-entry-page {

        padding: 0;

        background: white;
    }

    .form-card {

        box-shadow: none;

        border: none;
    }

    .form-actions {

        display: none;
    }

}

</style>


<div class="manual-entry-page">

    <div class="form-card">

        <!-- HEADER -->

        <div class="form-header">

            <h2>
                Manual Transaction Entry
            </h2>

            <p>
                Enter and save a transaction manually.
            </p>

        </div>


        <!-- FORM -->

        <form method="POST"
              class="transaction-form">

            {% csrf_token %}

            {{ form.as_p }}


            <!-- ACTIONS -->

            <div class="form-actions">

                <button
                    type="submit"
                    class="save-btn">

                    ✓ Save Transaction

                </button>

            </div>

        </form>

    </div>

</div>


{% endblock %}
