{% include 'web/main1.html' %}
{% load static %}

<div class="form-container">

    <div class="form-card">

        <h2>Manual Transaction Entry</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Save Transaction
            </button>

        </form>

    </div>

</div>

<style>

/* ================= PAGE ================= */

body{
    background:#f4f6f8;
    font-family:'Segoe UI', sans-serif;
}

/* ================= CONTAINER ================= */

.form-container{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

/* ================= CARD ================= */

.form-card{
    width:100%;
    max-width:700px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
}

/* ================= TITLE ================= */

.form-card h2{
    text-align:center;
    margin-bottom:25px;
    color:#051634;
    font-size:30px;
}

/* ================= FORM ================= */

form p{
    margin-bottom:18px;
}

form label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#374151;
}

/* ================= INPUTS ================= */

.form-control{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    transition:0.3s;
}

.form-control:focus{
    outline:none;
    border-color:#1390cd;
    box-shadow:0 0 0 3px rgba(19,144,205,0.15);
}

/* ================= BUTTON ================= */

button{
    width:100%;
    background:#1390cd;
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0f7aad;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    .form-card{
        padding:22px;
    }

    .form-card h2{
        font-size:24px;
    }

}

</style>
