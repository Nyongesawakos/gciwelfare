{% extends 'main.html' %}

{% block content %}

<style>

/* =========================================================
   PASSWORD SUCCESS PAGE
========================================================= */

.password-success-page {
    width: 100%;
    min-height: calc(100vh - 160px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 15px;
}


/* =========================================================
   SUCCESS CARD
========================================================= */

.password-success-card {

    width: 100%;
    max-width: 520px;

    background: #ffffff;

    border: 1px solid #dfe5ed;

    border-radius: 18px;

    padding: 40px 30px;

    text-align: center;

    box-shadow:
        0 15px 40px rgba(5, 22, 52, 0.12);
}


/* =========================================================
   SUCCESS ICON
========================================================= */

.password-success-icon {

    width: 70px;
    height: 70px;

    margin: 0 auto 20px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #15803d,
            #166534
        );

    color: #ffffff;

    font-size: 30px;

    box-shadow:
        0 8px 20px rgba(21, 128, 61, 0.25);
}


/* =========================================================
   TITLE
========================================================= */

.password-success-card h2 {

    margin: 0 0 12px;

    color: #051634;

    font-size: 24px;

    font-weight: 800;
}


/* =========================================================
   MESSAGE
========================================================= */

.password-success-card p {

    margin: 0 auto 25px;

    max-width: 420px;

    color: #6b7280;

    font-size: 14px;

    line-height: 1.7;
}


/* =========================================================
   HOME BUTTON
========================================================= */

.password-home-btn {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    min-height: 44px;

    padding: 11px 20px;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            #BA8E23,
            #8f6d18
        );

    color: #ffffff;

    text-decoration: none;

    font-size: 13px;

    font-weight: 700;

    border: none;

    box-shadow:
        0 5px 15px rgba(186, 142, 35, 0.25);

    transition: all .25s ease;
}


.password-home-btn:hover {

    color: #ffffff;

    background:
        linear-gradient(
            135deg,
            #d4aa45,
            #BA8E23
        );

    transform: translateY(-2px);

    box-shadow:
        0 8px 22px rgba(186, 142, 35, 0.35);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .password-success-page {

        min-height: calc(100vh - 120px);

        padding: 20px 10px;
    }

    .password-success-card {

        padding: 30px 20px;

        border-radius: 15px;
    }

    .password-success-icon {

        width: 60px;
        height: 60px;

        font-size: 25px;

        margin-bottom: 16px;
    }

    .password-success-card h2 {

        font-size: 20px;
    }

    .password-success-card p {

        font-size: 13px;

        line-height: 1.6;
    }

    .password-home-btn {

        width: 100%;

        min-height: 46px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    .password-success-page {

        padding: 15px 8px;
    }

    .password-success-card {

        padding: 25px 15px;
    }

    .password-success-card h2 {

        font-size: 18px;
    }

    .password-success-card p {

        font-size: 12px;
    }

}

</style>

<div class="password-success-page">

```
<div class="password-success-card">

    <!-- SUCCESS ICON -->

    <div class="password-success-icon">

        <i class="fa fa-check"></i>

    </div>


    <!-- TITLE -->

    <h2>
        Password Changed Successfully
    </h2>


    <!-- MESSAGE -->

    <p>
        Your password has been successfully changed.
        You can now continue using your GCI Welfare account
        with your new password.
    </p>


    <!-- HOME BUTTON -->

    <a
        href="{% url 'home' %}"
        class="password-home-btn"
    >

        <i class="fa fa-home"></i>

        Back to Homepage

    </a>

</div>
```

</div>

{% endblock %}
